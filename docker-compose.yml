# GRVT-Binance Grid Bots — self-host stack.
#
# What this stack runs:
#   - bot:      the trading engine + dashboard backend (Express + WS) + SPA
#   - notifier: Telegram sidecar (optional — disable if you don't want alerts)
#   - caddy:    HTTPS reverse proxy with automatic Let's Encrypt cert (optional
#               but recommended if you point a domain at this host)
#
# Usage:
#   1. cp .env.example .env  &&  edit .env with your GRVT + Binance API keys
#   2. docker compose up -d
#   3. open http://localhost:3849/dashboard/  (or https://your-domain/dashboard/
#      if you skip caddy by using the `--profile no-tls` flag)
#
# Data persistence:
#   - ./data    → bot's SQLite db + WAL files (uid 10000)
#   - ./logs    → bot + notifier logs
#   - ./caddy-data + ./caddy-config → caddy state (Let's Encrypt cert cache)
#
# Stopping safely: `docker compose stop bot` sends SIGTERM, which the bot
# catches and uses to gracefully cancel its monitoring loop while leaving
# all exchange open orders intact. Same as systemctl stop on the VPS.

services:
  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
      args:
        # Vite bakes VITE_* values into the dashboard bundle at build time.
        # Reuse the runtime dashboard key so WebSocket/API auth works after rebuilds.
        VITE_DASHBOARD_API_KEY: "${DASHBOARD_API_KEY}"
    image: grvt-binance/bot:latest
    container_name: grvt-binance-bot
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      DASHBOARD_PORT: "3849"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - ./data:/app/data
      - ./logs/bot:/app/logs
    ports:
      # Direct port for `--profile no-tls` deployments. With caddy, you can
      # remove this binding so only caddy is reachable from the internet.
      - "${BOT_PORT:-3849}:3849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3849/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - no-tls  # docker compose --profile no-tls

  notifier:
    build:
      context: .
      dockerfile: packages/notifier/Dockerfile
    image: grvt-binance/notifier:latest
    container_name: grvt-binance-notifier
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs/notifier:/app/logs
    profiles:
      - notifier

  caddy:
    image: caddy:3-alpine
    container_name: grvt-binance-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    profiles:
      - caddy  # docker compose --profile caddy

volumes:
  caddy-data:
  caddy-config: